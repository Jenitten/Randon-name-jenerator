<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Name</title>
<style>
  :root{
    --bg1:#ff9a9e; --bg2:#fad0c4; --bg3:#fbc2eb; --bg4:#a18cd1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow:hidden;
  }
  .card{
    background: rgba(255,255,255,0.85);
    border-radius: 24px;
    padding: 50px 60px;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: pop 0.5s ease;
  }
  @keyframes pop{
    0%{ transform: scale(0.7); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .emoji{
    font-size: 70px;
    display:block;
    margin-bottom: 10px;
    animation: bounce 1.2s infinite ease-in-out;
  }
  @keyframes bounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-10px); }
  }
  .name{
    font-size: 48px;
    font-weight: 800;
    background: linear-gradient(90deg, #ff512f, #dd2476, #6a11cb, #2575fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  .sub{
    margin-top: 12px;
    font-size: 15px;
    color: #555;
  }
  .refresh-btn{
    margin-top: 20px;
    padding: 10px 24px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg,#ff512f,#dd2476);
    color: white;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(221,36,118,0.4);
  }
  .refresh-btn:active{ transform: scale(0.96); }
</style>
</head>
<body>

<div class="card">
  <span class="emoji" id="emoji">🎉</span>
  <div class="name" id="name">Name</div>
  <div class="sub">Refresh the page for a new name</div>
  <button class="refresh-btn" onclick="location.reload()">🔄 New Name</button>
</div>

<script>
  const names = [
    { name: "Aarav", emoji: "🦁" },
    { name: "Priya", emoji: "🌸" },
    { name: "Kabir", emoji: "🐯" },
    { name: "Meera", emoji: "🦋" },
    { name: "Vihaan", emoji: "🚀" },
    { name: "Ananya", emoji: "🌟" },
    { name: "Dev", emoji: "⚡" },
    { name: "Ishaan", emoji: "🔥" },
    { name: "Kavya", emoji: "🌼" },
    { name: "Rudra", emoji: "🐉" },
    { name: "Sanvi", emoji: "🍀" },
    { name: "Arjun", emoji: "🏹" },
    { name: "Diya", emoji: "💎" },
    { name: "Vivaan", emoji: "🌊" },
    { name: "Myra", emoji: "🦄" },
    { name: "Reyansh", emoji: "🌈" },
    { name: "Aisha", emoji: "🌺" },
    { name: "Krish", emoji: "🎯" },
    { name: "Saanvi", emoji: "🎀" },
    { name: "Yuvan", emoji: "🛸" }
  ];

  const bgColors = [
    "linear-gradient(135deg,#ff9a9e,#fad0c4)",
    "linear-gradient(135deg,#a1c4fd,#c2e9fb)",
    "linear-gradient(135deg,#fbc2eb,#a6c1ee)",
    "linear-gradient(135deg,#fddb92,#d1fdff)",
    "linear-gradient(135deg,#84fab0,#8fd3f4)",
    "linear-gradient(135deg,#f6d365,#fda085)",
    "linear-gradient(135deg,#a18cd1,#fbc2eb)",
    "linear-gradient(135deg,#ff9a9e,#fecfef)"
  ];

  const pick = names[Math.floor(Math.random() * names.length)];
  const bg = bgColors[Math.floor(Math.random() * bgColors.length)];

  document.body.style.background = bg;
  document.getElementById("name").textContent = pick.name;
  document.getElementById("emoji").textContent = pick.emoji;
</script>

</body>
</html>
